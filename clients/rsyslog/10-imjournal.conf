# /etc/rsyslog.d/10-imjournal.conf - read the systemd journal directly (optional).
# RHEL/Rocky/Alma/SUSE already load imjournal in /etc/rsyslog.conf; do not install this file
# there. Use it on systems where rsyslog only reads /dev/log (imuxsock) and you want the
# structured journal metadata, or where journald does not forward to syslog.
module(load="imjournal"
       StateFile="imjournal.state"
       Ratelimit.Interval="600"
       Ratelimit.Burst="20000"
       IgnorePreviousMessages="on")
