name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shellcheck, yamllint, ruff, JSON, compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: python -m pip install --disable-pip-version-check yamllint==1.38.0 ruff==0.16.10
      - name: shellcheck
        run: shellcheck scripts/*.sh clients/*.sh tests/*.sh tests/*.bats tests/mocks/*
      - name: yamllint
        run: yamllint -s .
      - name: ruff
        run: ruff check scripts/ && ruff format --check scripts/
      - name: JSON syntax (jq)
        run: |
          for f in provisioning/*.json; do jq empty "$f" && echo "valid: $f"; done
      - name: Provisioning definitions (structure, references, TLS policy)
        run: python scripts/validate-definitions.py
      - name: Compose refuses to start without secrets
        run: |
          if docker compose config --quiet 2>err.txt; then
            echo "compose config succeeded without secrets" >&2; exit 1
          fi
          grep -q 'GRAYLOG_PASSWORD_SECRET\|MONGODB_ROOT_PASSWORD\|MONGODB_GRAYLOG_PASSWORD\|GRAYLOG_ROOT_PASSWORD_SHA2' err.txt
          cp .env.example .env
          if docker compose config --quiet 2>/dev/null; then
            echo "compose config succeeded with the empty .env.example" >&2; exit 1
          fi
          rm .env
      - name: Compose config is valid with secrets set
        env:
          GRAYLOG_PASSWORD_SECRET: ci-dummy-value-not-a-secret
          GRAYLOG_ROOT_PASSWORD_SHA2: ci-dummy-value-not-a-secret
          MONGODB_ROOT_PASSWORD: ci-dummy-value-not-a-secret
          MONGODB_GRAYLOG_PASSWORD: ci-dummy-value-not-a-secret
        run: |
          docker compose config --quiet
          # every image is pinned to an exact version
          docker compose config --images | tee images.txt
          if grep -Ev ':[0-9]+\.[0-9]+\.[0-9]+' images.txt; then echo "unpinned image" >&2; exit 1; fi

  test:
    name: Tests (bats)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - run: bats tests/

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        run: >
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner

  integration:
    name: Integration (Graylog stack, TLS inputs, rsyslog client, alerts)
    runs-on: ubuntu-24.04
    needs: [lint, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host settings for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Generate throw-away secrets and certificates
        run: |
          umask 077
          openssl rand -base64 33 | tr -dc 'A-Za-z0-9' > "$RUNNER_TEMP/admin.pw"
          echo "::add-mask::$(cat "$RUNNER_TEMP/admin.pw")"
          scripts/init-env.sh < "$RUNNER_TEMP/admin.pw"
          scripts/gen-certs.sh server localhost
          sudo chown root:1100 certs/server/graylog.key
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 600
      - name: Install a real rsyslog TLS client on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsyslog rsyslog-gnutls
          sudo clients/install-rsyslog-forwarding.sh --target localhost --ca certs/ca/ca.pem --apply --no-banner
      - name: End-to-end tests
        env:
          GRAYLOG_PASSWORD_FILE: ${{ runner.temp }}/admin.pw
          GCL_TEST_RSYSLOG: "1"
        run: tests/integration.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 300 graylog
          sudo tail -n 50 /var/log/syslog || true
          sudo journalctl -u rsyslog --no-pager -n 50 || true
      - name: Clean up
        if: always()
        run: |
          docker compose down -v || true
          rm -rf certs .env "$RUNNER_TEMP/admin.pw"
