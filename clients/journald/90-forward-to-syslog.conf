# /etc/systemd/journald.conf.d/90-forward-to-syslog.conf
# Make journald hand every message to the local syslog daemon (rsyslog), which forwards it
# to Graylog over TLS. Needed on distributions where ForwardToSyslog defaults to "no"
# (e.g. Debian 12+, Ubuntu 24.04 without rsyslog's imjournal). Keep a persistent local
# journal as well, so logs survive a network outage.
[Journal]
Storage=persistent
ForwardToSyslog=yes
MaxLevelSyslog=debug
